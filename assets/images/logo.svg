<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: teal gradient rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle top-shine for depth -->
  <rect width="512" height="512" rx="96" fill="url(#shine)"/>

  <!-- Bold white S letterform (two cubic bezier arcs) -->
  <!-- Upper arc curves right; lower arc curves left — forming an S -->
  <path d="M 256 88
           C 404 88, 408 256, 256 256
           C 104 256, 108 424, 256 424"
        stroke="white"
        stroke-width="56"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Horizontal split band through the waist of the S -->
  <!-- Dark teal strip (background colour) creates the illusion of a physical cut -->
  <rect x="72" y="242" width="368" height="28" rx="14" fill="#007A6E" opacity="0.75"/>

  <!-- Small white rounded caps at each end of the split to polish the look -->
  <circle cx="86"  cy="256" r="10" fill="white" opacity="0.35"/>
  <circle cx="426" cy="256" r="10" fill="white" opacity="0.35"/>
</svg>
