name: smartsplit
description: "SmartSplit - Intelligent Bill Splitting App"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  
  # Firebase
  cloud_functions: ^5.1.4
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.1.3
  
  # State Management
  provider: ^6.1.2
  
  # OCR / Image
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.69.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Deep links / URL launching (email, phone)
  url_launcher: ^6.3.1

  # Encryption (bank details at rest)
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Secure storage (biometric preference, sensitive keys)
  flutter_secure_storage: ^9.2.4

  # Biometric / device-credential authentication
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true